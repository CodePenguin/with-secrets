name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # run it by hand from the Actions tab on any branch

jobs:
  test:
    # The build (warnings are errors) and the whole .NET suite on every OS the program supports.
    strategy:
      fail-fast: false # one OS failing must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
      # The Windows runner defaults to core.autocrlf=true; this repository pins its files to LF with .gitattributes and the tests compare bytes.
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22 # the .NET build builds the administration web application; pinned so runner images cannot drift
    - name: Build
      run: dotnet build with-secrets.slnx
    - name: Test
      # The runner prints "N passed, M failed" and exits non-zero when anything failed.
      run: dotnet run --no-build --project tests/WithSecrets.Tests

  frontend:
    # The web application's own checks do not depend on the OS: api contract is current, typecheck, lint, unit and accessibility tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/WithSecrets.Admin.Web/package-lock.json
    - name: Install
      working-directory: src/WithSecrets.Admin.Web
      run: npm ci
    - name: Verify
      working-directory: src/WithSecrets.Admin.Web
      run: npm run verify

  desktop-companion:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: windows-latest, runtime: win-x64, cgo: '0' }
        - { os: ubuntu-latest, runtime: linux-x64, cgo: '0' }
        - { os: macos-latest, runtime: osx-arm64, cgo: '1' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    defaults:
      run:
        working-directory: src/WithSecrets.Desktop
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: src/WithSecrets.Desktop/go.mod
        cache-dependency-path: src/WithSecrets.Desktop/go.sum
    - name: Format, lint, and test
      run: |
        $unformatted = gofmt -l .
        if ($unformatted) { throw "Run gofmt on $unformatted" }
        go vet ./...
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go test ./...
    - name: Build standalone companion
      run: |
        $out = Join-Path $env:RUNNER_TEMP 'with-secrets-desktop'
        New-Item -ItemType Directory -Path $out | Out-Null
        if ($IsWindows) {
          $binary = Join-Path $out 'with-secrets-desktop.exe'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o $binary .
        } elseif ($IsMacOS) {
          $bundle = Join-Path $out 'With Secrets.app'
          $binary = Join-Path $bundle 'Contents/MacOS/with-secrets-desktop'
          New-Item -ItemType Directory -Path (Split-Path $binary) -Force | Out-Null
          Copy-Item Info.plist (Join-Path $bundle 'Contents/Info.plist')
          go build -trimpath -ldflags '-s -w' -o $binary .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          codesign --force --sign - $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          codesign --verify --strict $bundle
        } else {
          $binary = Join-Path $out 'with-secrets-desktop'
          go build -trimpath -ldflags '-s -w' -o $binary .
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item README.md, THIRD-PARTY-NOTICES.txt $out
        Get-Item $binary | Select-Object Name, Length
    - name: Archive the companion
      run: tar -czf "${{ runner.temp }}/with-secrets-desktop.tar.gz" -C "${{ runner.temp }}/with-secrets-desktop" .
    - uses: actions/upload-artifact@v7
      with:
        name: with-secrets-desktop-${{ matrix.runtime }}
        path: ${{ runner.temp }}/with-secrets-desktop.tar.gz
        if-no-files-found: error

  publish:
    # The release exactly as scripts/publish.ps1 makes and verifies it: one self-contained program with the web application embedded, for the platform of the runner.
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: windows-latest, runtime: win-x64, file: with-secrets.exe }
        - { os: ubuntu-latest, runtime: linux-x64, file: with-secrets }
        - { os: macos-latest, runtime: osx-arm64, file: with-secrets }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Publish and verify
      shell: pwsh
      run: scripts/publish.ps1 -Runtime ${{ matrix.runtime }}
    - name: Upload the program
      uses: actions/upload-artifact@v7
      with:
        name: with-secrets-${{ matrix.runtime }}
        path: artifacts/publish/${{ matrix.runtime }}/${{ matrix.file }}
        if-no-files-found: error

  e2e:
    # The real-browser scenarios (Chromium with a virtual passkey authenticator).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Build
      run: dotnet build tests/WithSecrets.E2E
    - name: Install Chromium
      shell: pwsh
      run: tests/WithSecrets.E2E/bin/Debug/net10.0/playwright.ps1 install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
    - name: Scenarios
      # Ends with ALL PASSED and exits non-zero when a scenario failed.
      run: dotnet run --no-build --project tests/WithSecrets.E2E
