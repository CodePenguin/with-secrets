name: release

# Starts when a version tag is pushed (v0.1.0, v0.2.0-rc.1). The tag must name the version in Directory.Build.props. Each platform runs the .NET suite, then builds
# and verifies the CLI and builds the desktop companion. The standalone CLI, desktop bundles, and checksums are attached to one GitHub release
# (a prerelease when the tag has a hyphen). Tag only when scripts/verify-all.ps1 passes locally and CI is green on the commit.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false # collect smoke-test results from every platform before publishing
      matrix:
        include:
        - { os: windows-latest, runtime: win-x64, file: with-secrets.exe }
        - { os: ubuntu-latest, runtime: linux-x64, file: with-secrets }
        - { os: macos-latest, runtime: osx-arm64, file: with-secrets }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
    - name: The tag must name the program's version
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
        if [ "$tag" != "$version" ]; then
          echo "::error::The tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
          exit 1
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - uses: actions/setup-go@v7
      with:
        go-version-file: src/WithSecrets.Desktop/go.mod
        cache-dependency-path: src/WithSecrets.Desktop/go.sum
    - name: Test
      run: dotnet run --project tests/WithSecrets.Tests
    - name: Publish and verify
      shell: pwsh
      run: scripts/publish.ps1 -Runtime ${{ matrix.runtime }}
    - name: Package standalone CLI
      # The EXE is attached as it is; a tarball keeps the executable bit of the others (an uploaded artifact does not).
      shell: bash
      run: |
        mkdir release
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp "artifacts/publish/${{ matrix.runtime }}/${{ matrix.file }}" "release/with-secrets-${{ matrix.runtime }}.exe"
        else
          tar -czf "release/with-secrets-${{ matrix.runtime }}.tar.gz" -C "artifacts/publish/${{ matrix.runtime }}" "${{ matrix.file }}"
        fi
    - name: Build and package desktop bundle
      shell: pwsh
      run: |
        $name = 'with-secrets-desktop-${{ matrix.runtime }}'
        $bundle = Join-Path $env:RUNNER_TEMP $name
        scripts/build-desktop.ps1 -Output $bundle
        Copy-Item 'artifacts/publish/${{ matrix.runtime }}/${{ matrix.file }}', LICENSE, THIRD-PARTY-NOTICES.md $bundle
        if ($IsWindows) {
          Compress-Archive -LiteralPath $bundle -DestinationPath "release/$name.zip"
        } else {
          tar -czf "release/$name.tar.gz" -C $env:RUNNER_TEMP $name
          if ($LASTEXITCODE -ne 0) { throw "Could not archive $name" }
        }
    - name: Smoke-test the extracted desktop bundle
      shell: pwsh
      run: |
        $name = 'with-secrets-desktop-${{ matrix.runtime }}'
        $scratch = Join-Path $env:RUNNER_TEMP 'extracted-bundle'
        New-Item -ItemType Directory -Path $scratch | Out-Null
        if ($IsWindows) {
          Expand-Archive -LiteralPath "release/$name.zip" -DestinationPath $scratch
          $desktopFile = 'with-secrets-desktop.exe'
        } else {
          tar -xzf "release/$name.tar.gz" -C $scratch
          if ($LASTEXITCODE -ne 0) { throw "Could not extract $name" }
          $desktopFile = if ($IsMacOS) { 'With Secrets.app/Contents/MacOS/with-secrets-desktop' } else { 'with-secrets-desktop' }
        }
        $bundle = Join-Path $scratch $name
        $cli = Join-Path $bundle '${{ matrix.file }}'
        $desktop = Join-Path $bundle $desktopFile
        foreach ($file in $cli, $desktop, (Join-Path $bundle 'LICENSE'), (Join-Path $bundle 'THIRD-PARTY-NOTICES.md'), (Join-Path $bundle 'THIRD-PARTY-NOTICES.txt')) {
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
        }
        if (!$IsWindows) {
          $test = Get-Command test -CommandType Application -ErrorAction Stop
          & $test.Source -x $desktop
          if ($LASTEXITCODE -ne 0) { throw 'The desktop executable lost its executable bit' }
        }
        if ($IsMacOS) {
          codesign --verify --strict (Join-Path $bundle 'With Secrets.app')
          if ($LASTEXITCODE -ne 0) { throw 'The extracted macOS app signature is invalid' }
        }
        & $cli --self-check
        if ($LASTEXITCODE -ne 0) { throw 'The bundled CLI self-check failed' }
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ matrix.runtime }}
        path: release/*
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release

    steps:
    - name: Download
      uses: actions/download-artifact@v8
      with:
        pattern: release-*
        merge-multiple: true
        path: release
    - name: Checksums
      working-directory: release
      run: sha256sum * > SHA256SUMS
    - name: Create the GitHub release
      # a release that already exists (written by hand) is left alone; edit the generated notes afterwards
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          echo "Release $GITHUB_REF_NAME already exists."
        else
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
        fi
